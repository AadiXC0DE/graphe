name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Copy a person or the model reads carries no em dashes.
      - run: npm run copy:check

  test:
    name: Tests
    # The suite includes the sandbox boundary, which only exists on macOS — the
    # product's own platform. Ubuntu would fail these tests for being the wrong
    # machine, not for being wrong code.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # The pinned list, same every time. Fails the build like the tests do,
      # because a gate nobody runs is not a gate.
      - run: npm run eval

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The renderer and the desktop shell bundle separately; both must build
      # before anything is said to work.
      - run: npm run build
      - run: npm run app:build

      # What a launch has to download, off the renderer build above. The main
      # chunk is the dominant cost — over the 450 KB the app promises, and most
      # of what a launch reads — so the numbers are recorded rather than blocked
      # on: the check's own exit status is kept, and the table goes into the
      # artifact and the job summary. The budget itself is held by the failing
      # expectation in tests/operations/build-budget.test.ts.
      - name: Measure the launch budget
        continue-on-error: true
        run: |
          set +e
          node scripts/perf-report.mjs --check --json=launch-budget.json > perf-report.txt 2>&1
          status=$?
          cat perf-report.txt
          {
            echo '### Launch budget'
            echo '```'
            cat perf-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Kept whether the number is over or not, so a regression has something to
      # be compared against.
      - name: Keep the launch budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-budget
          path: |
            perf-report.txt
            launch-budget.json
          if-no-files-found: warn
          retention-days: 30

  integration:
    name: Integration (in process)
    # A whole turn against a scripted model, run through the shell's own
    # decision modules with no window: integration coverage, not the real
    # Electron suite, which is `electron-smoke` below. macOS because the
    # boundary this runs behind only exists on the product's own platform.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/e2e

  electron-smoke:
    name: Electron smoke
    # The only job that runs the shipped shell in a real window: a built
    # renderer, a built main process, and a profile thrown away afterwards. A
    # window needs a desktop, which is what the product's own platform gives.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Builds both halves itself, so it fails on the app rather than on a
      # missing artifact from another job.
      - run: npm run test:electron

  package:
    name: Package
    # A build nobody packages is a build that fails on the day of a release.
    # This is the same run RELEASING.md does by hand, on the same platform.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The manifest describes the tree that is about to ship, and it is read
      # out of the installed tree — which differs by platform, because half of
      # what is installed is a platform's own binaries. So it is checked here,
      # on the machine the app is actually built on, and nowhere else.
      - run: npm run licenses:check
      - run: npm run package
      # Opens what was built: the agent runtime is inside it, and it is signed.
      - run: npm run verify:package
