name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests
    # The suite includes the sandbox boundary, which only exists on macOS — the
    # product's own platform. Ubuntu would fail these tests for being the wrong
    # machine, not for being wrong code.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # The pinned list, same every time. Fails the build like the tests do,
      # because a gate nobody runs is not a gate.
      - run: npm run eval

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The renderer and the desktop shell bundle separately; both must build
      # before anything is said to work.
      - run: npm run build
      - run: npm run app:build
      # The licence manifest has to describe the tree that is about to ship.
      - run: npm run licenses:check

  e2e:
    name: End to end
    # The fake model runs the real shell, and the boundary it runs behind only
    # exists on macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/e2e

  package:
    name: Package
    # A build nobody packages is a build that fails on the day of a release.
    # This is the same run RELEASING.md does by hand, on the same platform.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package
      # Opens what was built: the agent runtime is inside it, and it is signed.
      - run: npm run verify:package
